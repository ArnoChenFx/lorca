# Merges egoist/lorca's main into the mobile-apk branch every day (and when run by hand),
# so the branch that builds the Android APK keeps following upstream. A push that brings
# mobile/ changes triggers the Release mobile APK workflow on mobile-apk.
#
# This file has to live on the default branch: scheduled workflows only run from the
# default branch's copy of the file. The merge target (mobile-apk) is named below.
#
# One-time setup: fine-grained PAT on this repo with Contents read+write and Workflows
# read+write (upstream merges may touch .github/workflows/). Save it as SYNC_PAT. The merge
# pushes with that token, not GITHUB_TOKEN, so the APK workflow runs on the push.
name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *" # 11:17 CST, daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the SYNC_PAT secret
        run: |
          if [[ -z "${{ secrets.SYNC_PAT }}" ]]; then
            echo "::error::SYNC_PAT secret is not set. Create a fine-grained PAT with Contents read+write and Workflows read+write on this repository, save it as SYNC_PAT, and re-run."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: mobile-apk
          # Persisted for the push below, so it triggers the APK workflow.
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Merge upstream/main into mobile-apk
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/egoist/lorca.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "mobile-apk already contains upstream/main; nothing to do."
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            git push origin mobile-apk
            echo "Merged $(git rev-parse --short upstream/main) into mobile-apk."
          else
            git merge --abort
            echo "::error::upstream/main does not merge cleanly into mobile-apk. Resolve the conflict locally on mobile-apk and push; the next scheduled run will continue."
            exit 1
          fi
