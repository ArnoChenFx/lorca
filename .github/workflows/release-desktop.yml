# Releases the Windows and Linux app (desktop/) as a release of this repository tagged
# desktop-vX.Y.Z. The repository's latest release stays the CLI's, which install-cli.sh and
# install-cli.ps1 download, and the apps find the newest desktop-v release through the GitHub API.
# A tag desktop-vX.Y.Z, naming the version in desktop/package.json, drafts the release with the
# version's section of desktop/CHANGELOG.md as its notes, then builds Windows x64, Linux x64 and
# Linux arm64 side by side. A run by hand does the same for any commit, branch or tag (its "ref",
# else the branch it runs on), naming the release after that commit's desktop/package.json; the tag
# appears when the draft is published. Each build runs
# `bun run release-desktop <platform>`: the CLI with cargo-zigbuild, then `mygo build -upload`,
# which builds the app and its installer, signs the update archive and deltas, and uploads them to
# the draft. Publishing the draft, without making it the latest release, once every platform is
# there makes it the update apps see. docs/releasing-desktop.md has the steps.
name: Release desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to release (default the branch the run uses)
        required: false

permissions:
  contents: read

# One run at a time, so two runs never upload to the same release.
concurrency:
  group: release-desktop

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      # The commit to release, which every job checks out: a pushed tag's, or a run's ref, a
      # branch, tag, or (short) SHA.
      - id: commit
        name: Find the commit to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha); then
            echo "::error::$REF is not a commit, branch, or tag of $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - id: package
        name: Name the release after desktop/package.json
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          sha=$SHA
          version=$(jq -r .version desktop/package.json)
          tag=desktop-v$version
          # A pushed tag has to name the version the app says it is.
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF_NAME != "$tag" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in desktop/package.json: set \"version\" there to ${GITHUB_REF_NAME#desktop-v} and tag that commit"
            exit 1
          fi
          # A release takes the tag that exists, so the builds have to come from its commit.
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) && [[ $tagged != "$sha" ]]; then
            echo "::error::$tag already tags $tagged: release that commit, or bump \"version\" in desktop/package.json"
            exit 1
          fi
          echo "::notice::releasing $tag from $sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The builds upload into one draft, which this job makes first; each would make its own.
  draft:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Draft ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null); then
            state=none
          fi
          case $state in
            published)
              echo "::error::$TAG is already published: bump \"version\" in desktop/package.json"
              exit 1
              ;;
            draft)
              # An earlier run's draft takes these builds, from this commit.
              echo "::notice::the draft $TAG takes these builds"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA"
              ;;
            none)
              bun -e '
                import { extractReleaseNotes } from "./scripts/changelog.ts"
                const notes = extractReleaseNotes(await Bun.file("desktop/CHANGELOG.md").text(), process.env.VERSION)
                if (!notes) {
                  console.error(`::error::desktop/CHANGELOG.md has no "## [${process.env.VERSION}]" section`)
                  process.exit(1)
                }
                await Bun.write("notes.md", notes + "\n")
              '
              # Not the latest release, which stays the CLI's. On the commit the builds come from,
              # where publishing the draft makes the tag when it is not there yet.
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false --target "$SHA" --title "Lorca for Windows and Linux $VERSION" --notes-file notes.md
              ;;
          esac

  build:
    name: build ${{ matrix.platform }}
    needs: [version, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # A platform that fails leaves the others to finish their uploads.
      fail-fast: false
      matrix:
        include:
          # MyGo builds every platform from Linux without cgo, and zig, through cargo-zigbuild,
          # builds the CLI inside each app as the CLI releases do: static (musl) for Linux.
          - { platform: windows/amd64, target: x86_64-pc-windows-gnu }
          - { platform: linux/amd64, target: x86_64-unknown-linux-musl }
          - { platform: linux/arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: oven-sh/setup-bun@v2
      # makensis, which mygo build needs for the Windows installer on Linux.
      - name: Install NSIS
        if: startsWith(matrix.platform, 'windows/')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - run: bun install --frozen-lockfile
      - name: Build and upload
        env:
          PLATFORM: ${{ matrix.platform }}
          # gh uploads with it, and mygo build reads the GitHub API with it for delta updates.
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run release-desktop "$PLATFORM"
