# Releases the Windows and Linux app (desktop/) to https://releases.lorca.app, the R2 bucket
# lorca-releases, where installed apps look for updates. Run by hand, it releases the version in the
# root package.json, whose section in CHANGELOG.md becomes the notes of the update window:
# `bun run release-desktop` builds the CLI for each platform with cargo-zigbuild, then
# `mygo build -upload` builds the apps and installers, signs the update archives and deltas, and
# uploads them, the manifests last. A version that is already published is left alone unless
# "force" is ticked. docs/releasing-desktop.md has the steps and the secrets.
name: Release desktop

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: MyGo platforms, comma separated
        default: linux/amd64,windows/amd64
      force:
        description: Replace the version if it is already published
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, so two runs never upload the same version.
concurrency:
  group: release-desktop

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The CLI inside each app: static (musl) for Linux and x86_64-pc-windows-gnu for Windows, as
      # the CLI releases build them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: oven-sh/setup-bun@v2
      # makensis, which mygo build needs for the Windows installer on Linux.
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - run: bun install --frozen-lockfile
      - name: Build and upload
        env:
          PLATFORMS: ${{ inputs.platforms }}
          FORCE: ${{ inputs.force && '1' || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun run release-desktop "$PLATFORMS"
