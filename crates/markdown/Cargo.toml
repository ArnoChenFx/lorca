[package]
name = "lorca-markdown"
description = "Message Markdown as blocks and spans, parsed with pulldown-cmark, for every Lorca app to render natively"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lorca_markdown"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
uniffi = "0.32"
